[package]
name = "everywhere-host"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Everywhere host: use this PC from any browser, over WebRTC, with no server"

[features]
default = ["openh264", "audio"]
# Software H.264 encoder (portable). Hardware encoders come later.
openh264 = ["dep:openh264"]
# System audio + Opus. Windows: WASAPI loopback (cpal). macOS:
# ScreenCaptureKit. Linux: the PulseAudio/PipeWire monitor through `parec`.
audio = ["dep:cpal", "dep:audiopus"]

[dependencies]
openh264 = { version = "0.9", optional = true }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Password handshake (CPace on ristretto255) and message encryption.
curve25519-dalek = "5"
sha2 = "0.11"
hmac = "0.13"
aes-gcm = "0.11"
getrandom = "0.4"
hex = "0.4"
base64 = "0.22"
# Meeting point: Nostr events (BIP-340 Schnorr) over WebSockets.
k256 = { version = "0.14", features = ["schnorr"] }
tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = "0.2"
# Router port mapping (UPnP IGD).
igd-next = "0.18"
audiopus = { version = "0.3.0-rc.0", optional = true }

# WebRTC. Crypto backend per OS: Windows uses the system's CNG (no C
# toolchain needed to build); elsewhere the RustCrypto backend.
[target.'cfg(not(windows))'.dependencies]
str0m = { version = "0.26", default-features = false, features = ["rust-crypto"] }

# The app window (Windows: WebView2, built into Windows 10/11; macOS:
# WKWebView). Linux keeps the terminal and the status page in a browser.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.38"
wry = "0.58"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18", optional = true }
str0m = { version = "0.26", default-features = false, features = ["wincrypto"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
enigo = "0.6"
objc2 = "0.6"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
