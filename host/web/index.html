<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everywhere</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --mute:#8b949e; --ok:#3fb950; --bad:#f85149; --panel:#161b22cc; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  video { width:100%; height:100%; object-fit:contain; background:#000; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; background:var(--bg); }
  #start h1 { margin:0; font-size:28px; }
  #start p { margin:0; color:var(--mute); max-width:420px; text-align:center; padding:0 16px; }
  button { font:inherit; padding:10px 22px; border-radius:8px; border:0; background:#238636; color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #stats { position:fixed; top:8px; left:8px; padding:8px 10px; background:var(--panel); border-radius:6px;
           font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre; pointer-events:none; }
  #status { color:var(--mute); }
  .bad { color:var(--bad); }
</style>
</head>
<body>
<div id="stage"><video id="video" autoplay playsinline muted></video></div>
<div id="stats" hidden></div>
<div id="start">
  <h1>Everywhere</h1>
  <p>Phase 1 test: the host streams a test pattern. The numbers in the corner show the real delay from the host's capture to this screen.</p>
  <button id="go">Connect</button>
  <div id="status"></div>
</div>
<script type="module" src="client.js"></script>
</body>
</html>
