<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Everywhere logo for 16-48 px: same tile, one streak, no rim. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3440"/><stop offset="1" stop-color="#560a12"/>
    </linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#f)"/>
  <rect x="-20" y="22" width="104" height="12" fill="#fff" opacity=".22" clip-path="url(#c)" transform="rotate(-45 32 32)"/>
</svg>
