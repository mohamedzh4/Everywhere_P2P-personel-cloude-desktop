# Tests on every push and pull request.
name: CI
on:
  push:
  pull_request:

env:
  # libopus (built by audiopus_sys) declares an old minimum CMake; CMake 4
  # refuses it unless this is set.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web client tests (crypto vectors shared with Rust, input layout)
        working-directory: web
        run: node test/run.mjs

  host-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (OpenSSL, cmake for Opus)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Tests
        working-directory: host
        run: cargo test --release

  host-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Tests
        working-directory: host
        run: cargo test --release

  host-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Tests
        working-directory: host
        run: cargo test --release
      - name: Build
        working-directory: host
        run: cargo build --release
