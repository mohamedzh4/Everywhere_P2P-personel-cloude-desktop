# Publishes web/ to GitHub Pages:
# https://mohamedzh4.github.io/Everywhere_P2P-personel-cloude-desktop/
# Build and deploy are separate jobs (as in GitHub's own template): the deploy
# job starts only after the uploaded site is finalised, which avoids
# "No artifacts named github-pages were found" when both run in one job.
name: Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test before publishing
        working-directory: web
        run: node test/run.mjs
      - name: Site files only
        run: |
          mkdir -p _site
          cp -r web/index.html web/css web/js web/vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
