# Builds the Windows host when a version tag is pushed (git tag v0.1.0 &&
# git push --tags) and attaches it to a GitHub Release.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: host
        run: cargo test --release
      - name: Build
        working-directory: host
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item host/target/release/everywhere-host.exe dist/Everywhere.exe
          Copy-Item docs/install-windows.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath "Everywhere-${{ github.ref_name }}-windows-x64.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "Everywhere-${{ github.ref_name }}-windows-x64.zip" --title "Everywhere ${{ github.ref_name }}" --generate-notes
