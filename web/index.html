<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-RzAL5ah1Q315YiagDEsrSlkPoOVkrvmNfyb1Z0Re9i0='; connect-src 'self' wss:; img-src 'self' data:; style-src 'self'; media-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Everywhere</title>
<meta name="description" content="Use your own PC from this browser. Nothing to install.">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports":{"@noble/curves/":"./vendor/noble-curves/","@noble/hashes/":"./vendor/noble-hashes/"}}</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<section id="connect">
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
      </svg>
      <h1>Everywhere</h1>
    </div>
    <p class="lead">Your own PC, in this browser.</p>
    <p class="warn" id="compat" hidden></p>
    <form id="form" autocomplete="off">
      <label for="code">PC code</label>
      <input id="code" type="text" inputmode="numeric" placeholder="482-913-007" maxlength="11" autocomplete="off" spellcheck="false" required>
      <label for="password">Password</label>
      <!-- autocomplete="one-time-code" keeps browsers from offering to save it on a borrowed laptop -->
      <input id="password" type="password" placeholder="xxxx-xxxx-xxxx" autocomplete="one-time-code" spellcheck="false" required>
      <label class="check"><input id="remember" type="checkbox"> Remember the PC code on this browser (never the password)</label>
      <button class="primary" id="go" type="submit">Connect</button>
      <div id="step" role="status" aria-live="polite"></div>
    </form>
    <p class="foot">Both are shown by Everywhere on your PC. Nothing is installed or saved here. The stream goes straight to your PC, encrypted.
      <a href="https://github.com/mohamedzh4/Everywhere_P2P-personel-cloude-desktop" target="_blank" rel="noopener">Open source</a></p>
  </div>
</section>

<section id="player" hidden>
  <video id="video" autoplay playsinline></video>
  <div id="bar">
    <span class="pill" id="path">…</span>
    <span class="pill" id="ping"></span>
    <button id="fullscreen" title="Full screen, and keys like Esc and Alt+Tab go to your PC">Full screen</button>
    <button id="toggle-stats">Stats</button>
    <button id="disconnect" class="end">Disconnect</button>
  </div>
  <div id="stats" hidden></div>
  <div id="hint">Click the picture to control your PC</div>
</section>
</body>
</html>
